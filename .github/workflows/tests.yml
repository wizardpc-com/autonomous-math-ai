name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zero-budget:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python scripts/check_release.py dist/*
      - name: Install wheel
        run: >-
          python -c "import glob, subprocess, sys;
          wheel = glob.glob('dist/*.whl');
          assert len(wheel) == 1, wheel;
          subprocess.check_call([sys.executable, '-m', 'pip', 'install',
          '--force-reinstall', '--no-deps', wheel[0]])"
      - run: python -m pip check
      - run: python -m unittest discover -s tests -p "test_*.py" -q
      - run: amr --help
      - name: Generic zero-model acceptance
        run: >-
          python -c "import pathlib, subprocess, sys, tempfile;
          root = pathlib.Path(tempfile.mkdtemp()) / 'neutral-target';
          commands = [
          ['amr', 'init', str(root)],
          ['amr', 'validate', '--project', str(root)],
          ['amr', 'run', '--project', str(root), '--dry-run'],
          ['amr', 'run', '--project', str(root), '--mock', '--hours', '0.01']];
          [subprocess.check_call(command) for command in commands]"
