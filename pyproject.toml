[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-math-ai"
version = "0.2.5"
description = "Auditable AI orchestration for mathematical, certified-computational, and empirical research"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Autonomous Math AI contributors"}]
keywords = [
  "artificial intelligence",
  "autonomous agents",
  "automated reasoning",
  "computational research",
  "empirical research",
  "mathematical research",
  "reproducible research",
  "theorem proving",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/wizardpc-com/autonomous-math-ai"
Documentation = "https://github.com/wizardpc-com/autonomous-math-ai/tree/main/docs"
Repository = "https://github.com/wizardpc-com/autonomous-math-ai"
Issues = "https://github.com/wizardpc-com/autonomous-math-ai/issues"
Changelog = "https://github.com/wizardpc-com/autonomous-math-ai/blob/main/CHANGELOG.md"

[project.scripts]
amr = "autonomous_math_research.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autonomous_math_research = [
  "resources/schemas/*.json",
  "resources/policy_packs/**/*.md",
  "resources/policy_packs/**/*.json",
  "resources/policy_packs/**/*.py",
]

[tool.unittest]
start-directory = "tests"
